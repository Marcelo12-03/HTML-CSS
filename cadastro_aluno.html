<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="utf-8">
	<title>Cadastro do Aluno</title>
</head>
<body>
	<h1>Inscrição de novos Alunos</h1>
<form>
	<label>Nome completo do aluno(a):</label><br>
<input type="text"><br><br>
    <label>E-mail de contato:</label><br>
<input type="email"><br><br>
    <label>Senha de acesso:</label><br>
<input type="password"><br><br>
    <label>Idade do aluno:</label><br>
<input type="number"><br><br>

    <label>Selecionar habitação desejada:</label><br>
<input type="radio" name="habitação" value="A"> Categoria A<br>
<input type="radio" name="habitação" value="B"> Categoria B<br><br>

    <label>Turno das aulas teoricas:</label>
<select>
	<option>Manhã</option>
	<option>Tarde</option>
	<option>Noite</option>
</select><br><br>

    <label>Envie foto do seu documento:</label>
<input type="file"><br><br>
<button>Confirmar matricula</button>
</form>
</body>
</html>
