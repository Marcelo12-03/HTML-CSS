<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="Aula9.css">
    <title>Aula 9</title>
</head>
<body>
    <div class="painel-nave">
        <header>
            <h1>Módulo Orion-X</h1>
            <p class="coordenadas">Setor: Alpha-Centauri</p>
            <div class="telemetria">
                <span>Análise do Núcleo: </span><strong>Núcleo Ativo</strong>
                <span class="reator-brilho"></span>
            </div>
        </header>

        <main class="grade-modulos">
            <div class="card-modulo" style="animation-delay: 0.2s;">
                <h2>Sistema de Escudo</h2>
                <p class="status-funcionamento status-ativo">Integridade do Escudo: 98%</p>
            </div>

            <div class="card-modulo" style="animation-delay: 0.4s;">
                <h2>Hiper-Velocidade</h2>
                <div class="barra-vazia">
                    <div class="barra-impulso"></div>
                </div>
            </div>

            <div class="card-modulo" style="animation-delay: 0.6s;">
                <h2>Matéria Escura</h2>
                <p class="combustivel-porcentagem">Carga de Combustível: 84%</p>
            </div>

            <div class="card-modulo" style="animation-delay: 0.8s;">
                <h2>Scanner de Proximidade</h2>
                <div class="radar-varredura"></div>
            </div>
        </main>
    </div>
</body>
</html>
