<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<title>Aula 3 - Formularios</title>
</head>
<body>
	<h1>Formulario de contato</h1>
<form>
	<label>Seu nome:</label>
<input type="text"><br><br>
    
    <label>E-mail:</label>
<input type="email"><br><br>
    <label>Telefone:</label>
<input type="tel"><br><br>
    <label>Idade:</label>
<input type="number"><br><br>
    <label>Senha:</label>
<input type="password"><br><br>

    <label>Sua mensagem:</label><br>
<textarea></textarea><br><br>
    <label>Escolha sua cor favorita:</label><br><br>
<input type="radio" name="cor" value="azul"> Azul<br>
<input type="radio" name="cor" value="vermelho"> Vermelho<br><br>
    
    <label>Escolha seus hobbies:</label><br><br>
<input type="checkbox" value="musica"> Musica<br>
<input type="checkbox" value="jogos"> Jogos<br><br>
    <label>Escolha seu estado:</label>
<select>
	<option>RS</option>
	<option>SC</option>
	<option>RJ</option>
</select><br><br>

<label>Envie um arquivo:</label>
<input type="file"><br><br>
<button>Enviar</button>
</form>
</body>
</html>
